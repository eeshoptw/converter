<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蝦皮推廣連結轉換器</title><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><section class="card">
<div class="badge">省錢好康分享</div><h1>蝦皮推廣連結轉換器</h1><p class="subtitle">貼上蝦皮商品連結,一鍵換成推廣連結</p>
<label for="urlInput">蝦皮連結</label>
<textarea id="urlInput" placeholder="一次最多貼上 5 個蝦皮連結，每行一個"></textarea>
<div class="buttons"><button id="convertBtn">產生推廣連結</button><button id="clearBtn" class="secondary">清除</button></div>

<p id="status"></p><div id="resultArea" class="result-area"></div>
</section></main><div id="toast">已複製</div><script src="app.js"></script></body></html>
